name: ci
on: pull_request
jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m
  go-test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        if: success()
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: go tests
        run: (set -o pipefail && go test -v -covermode=count -json ./... | tee test.json)
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.5.1
        with:
          test-results: test.json

  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      # Credentials and host of the in-repo mock API (cmd/test-server).
      BATON_ACCESS_KEY: test-access-key
      BATON_SECRET_KEY: test-secret-key
      BATON_BASE_URL: http://localhost:8765
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Build baton-tenable-vm
        run: go build ./cmd/baton-tenable-vm
      - name: Build test server
        run: go build -o test-server ./cmd/test-server
      - name: Start test server
        run: ./test-server &
      - name: Wait for test server
        run: |
          for i in $(seq 1 10); do
            curl -sf "$BATON_BASE_URL/health" > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Test server failed to start"
          exit 1
      # Fixtures from cmd/test-server/seeds.go: Bob (user 1002) is a member of
      # Engineering (group 101). sync-test@v4 covers sync + grant/revoke
      # idempotency (GrantAlreadyExists / GrantAlreadyRevoked).
      - name: Grant/Revoke group membership
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-tenable-vm
          baton-entitlement: group:101:member
          baton-principal: '1002'
          baton-principal-type: user
      - name: Stop test server
        if: always()
        run: pkill -f test-server || true
