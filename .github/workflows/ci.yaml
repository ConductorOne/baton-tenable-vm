name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      # Mock credentials / host — set via gh secret/variable against cmd/test-server.
      BATON_ACCESS_KEY: ${{ secrets.BATON_ACCESS_KEY }}
      BATON_SECRET_KEY: ${{ secrets.BATON_SECRET_KEY }}
      BATON_BASE_URL: ${{ vars.BATON_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Build baton-tenable-vm
        run: go build ./cmd/baton-tenable-vm
      - name: Build test server
        run: go build -o test-server ./cmd/test-server
      - name: Start test server
        run: ./test-server &
      - name: Wait for test server
        run: |
          for i in $(seq 1 10); do
            curl -sf "$BATON_BASE_URL/health" > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Test server failed to start"
          exit 1
      # get-baton@v4 always hits baton-sdk /releases/latest. v0.21.0 published
      # with zero assets, so pre-install from the last release that has binaries
      # (matches go.mod). get-baton then no-ops when baton is already on PATH.
      - name: Install baton CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=v0.20.8
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -o baton.tgz \
            "https://github.com/conductorone/baton-sdk/releases/download/${VER}/baton-${VER}-linux-amd64.tar.gz"
          tar xzf baton.tgz
          sudo mv baton /usr/local/bin/baton
          baton --help >/dev/null
      # Fixtures from cmd/test-server/seeds.go (Bob / Engineering). sync-test@v4
      # covers sync + grant/revoke idempotency.
      - name: Grant/Revoke group membership
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-tenable-vm
          baton-entitlement: ${{ vars.TEST_ENTITLEMENT_GROUP }}
          baton-principal: ${{ vars.TEST_PRINCIPAL }}
          baton-principal-type: ${{ vars.TEST_PRINCIPAL_TYPE }}
      # enable_account / disable_account actions — Bob starts enabled.
      # Action names match RegisterActionManager (not the enable_user defaults).
      - name: Account status lifecycle
        uses: ConductorOne/github-workflows/actions/account-status-lifecycle-test@v4
        with:
          connector: ./baton-tenable-vm
          account-id: ${{ vars.TEST_PRINCIPAL }}
          enable-action-name: enable_account
          disable-action-name: disable_account
          id-parameter-name: user_id
          test-flow: disable-enable
      # Note: account-provisioning@v4 is intentionally omitted — Delete soft-
      # disables the user (Tenable practice), so the action's "must disappear
      # from sync" assertion would fail against both the mock and the live API.
      - name: Stop test server
        if: always()
        run: pkill -f test-server || true
